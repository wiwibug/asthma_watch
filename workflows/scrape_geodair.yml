name:  Scraping Geodair (quotidien)

on:
  schedule:
    # Tous les jours à 12h00 UTC (14h Paris été, 13h hiver)
    - cron: '0 12 * * *'
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout du repo
        uses: actions/checkout@v4

      - name:  Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name:  Installer les dépendances
        run: |
          pip install requests pandas openpyxl unidecode

      - name:  Lancer le scraper Geodair
        run: python scripts/geodair.py

      - name:  Commit et push des données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/geodair_max_daily.csv data/geodair_max_weekly.csv data/geodair_iqa_daily.csv data/geodair_station.csv
          git diff --staged --quiet || git commit -m " [auto] Mise à jour données Geodair - $(date +'%Y-%m-%d')"
          git push
