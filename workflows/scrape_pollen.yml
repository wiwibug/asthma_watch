name: 🌸 Scraping Pollen (hebdomadaire)

on:
  schedule:
    # Tous les lundis à 08h00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout du repo
        uses: actions/checkout@v4

      - name:  Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name:  Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml

      - name:  Lancer le scraper Pollen
        run: python scripts/pollen.py

      - name:  Commit et push des données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pollen.csv
          git diff --staged --quiet || git commit -m "🤖 [auto] Mise à jour données Pollen - $(date +'%Y-%m-%d')"
          git push
